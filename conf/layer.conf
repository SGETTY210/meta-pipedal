# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pipedal"
BBFILE_PATTERN_meta-pipedal = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pipedal = "6"

LAYERDEPENDS_meta-pipedal = "core openembedded-layer networking-layer multimedia-layer"
LAYERSERIES_COMPAT_meta-pipedal = "wrynose"
